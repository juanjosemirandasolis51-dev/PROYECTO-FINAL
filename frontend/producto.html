<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle del producto - Subastas</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header id="encabezado" class="encabezado"></header>

  <main class="contenedor">
    <p id="mensaje-carga" class="mensaje" hidden></p>

    <div id="contenido" hidden>
      <div class="detalle">

        <section class="tarjeta">
          <h1><span id="nombre"></span> <span id="estado" class="insignia"></span></h1>
          <p class="descripcion" id="descripcion"></p>
          <dl class="cifras">
            <div><dt>Puja mas alta</dt><dd id="puja-mas-alta" class="destacada"></dd></div>
            <div><dt>Precio base</dt><dd id="precio-base"></dd></div>
            <div><dt id="titulo-ganador">Va ganando</dt><dd id="ganador"></dd></div>
            <div><dt>Termina en</dt><dd id="tiempo" class="tiempo"></dd></div>
            <div><dt>Vendedor</dt><dd id="vendedor"></dd></div>
            <div><dt>Cierra</dt><dd id="fecha-fin"></dd></div>
          </dl>
        </section>

        <section class="tarjeta panel-puja">
          <div id="zona-puja">
            <h2>Hacer una puja</h2>
            <form id="form-puja" novalidate>
              <label>Tu oferta (COP)
                <input type="number" name="monto" step="1" inputmode="numeric" required>
                <span class="ayuda" id="minimo"></span>
              </label>
              <p id="mensaje-puja" class="mensaje" hidden></p>
              <button type="submit" class="boton primario">Pujar</button>
            </form>
          </div>
          <div id="zona-resultado" class="resultado" hidden></div>
        </section>
      </div>

      <section class="tarjeta seccion">
        <h2>Historial de pujas</h2>
        <div class="tabla-contenedor">
          <table>
            <thead>
              <tr><th>#</th><th>Usuario</th><th class="numero">Valor</th><th>Hora</th></tr>
            </thead>
            <tbody id="historial"></tbody>
          </table>
        </div>
        <p id="sin-pujas" class="vacio" hidden>Aun no hay pujas. Se el primero!</p>
      </section>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/api.js"></script>
  <script src="js/producto.js"></script>
</body>
</html>
