<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesion - Subastas</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-acceso">

  <main class="tarjeta acceso">
    <h1>Subastas</h1>
    <p class="subtitulo">Inicia sesion para pujar o publicar productos</p>

    <form id="form-login" novalidate>
      <label>Correo
        <input type="email" name="correo" autocomplete="email" required>
      </label>
      <label>Contraseña
        <input type="password" name="contrasena" autocomplete="current-password" required>
      </label>
      <p id="mensaje" class="mensaje" hidden></p>
      <button type="submit" class="boton primario">Entrar</button>
    </form>

    <p class="pie">No tienes cuenta? <a href="registro.html">Registrate</a></p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
